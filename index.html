<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0618">
<title>Building...</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0a0618}

  body{
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #f5f0ff;
    display: grid;
    place-items: center;
    min-height: 100svh;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Background (single layer, GPU) ===== */
  .bg{
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,122,61,.22), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(168,85,247,.22), transparent 45%),
      linear-gradient(180deg, #0a0618, #150a2e);
    animation: bgShift 12s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes bgShift{
    0%,100%{transform: scale(1) rotate(0deg)}
    50%{transform: scale(1.06) rotate(2deg)}
  }

  /* ===== Grid ===== */
  .grid{
    position: fixed;
    inset: -50%;
    z-index: 1;
    opacity: .1;
    background-image:
      linear-gradient(rgba(255,122,61,.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,122,61,.5) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(700px) rotateX(58deg);
    animation: gridMove 6s linear infinite;
    mask-image: radial-gradient(ellipse at center, #000 25%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 25%, transparent 70%);
    will-change: background-position;
  }
  @keyframes gridMove{
    to { background-position: 0 60px, 60px 0; }
  }

  /* ===== Orbs ===== */
  .orb{
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    z-index: 1;
    pointer-events: none;
    opacity: .45;
    will-change: transform;
  }
  .o1{
    width: 280px; height: 280px;
    background: #ff7a3d;
    top: 8%; left: 8%;
    animation: o1 12s ease-in-out infinite;
  }
  .o2{
    width: 240px; height: 240px;
    background: #a855f7;
    bottom: 12%; right: 10%;
    animation: o2 14s ease-in-out infinite;
  }
  .o3{
    width: 180px; height: 180px;
    background: #ff9a5c;
    top: 62%; left: 62%;
    animation: o3 16s ease-in-out infinite;
  }
  @keyframes o1{
    0%,100%{transform: translate3d(0,0,0)}
    50%{transform: translate3d(70px,50px,0)}
  }
  @keyframes o2{
    0%,100%{transform: translate3d(0,0,0)}
    50%{transform: translate3d(-60px,-45px,0)}
  }
  @keyframes o3{
    0%,100%{transform: translate3d(0,0,0)}
    50%{transform: translate3d(-55px,60px,0)}
  }

  /* ===== Particles ===== */
  .particles{
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
    contain: strict;
  }
  .p{
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    opacity: 0;
    animation: rise linear infinite;
    will-change: transform, opacity;
  }
  @keyframes rise{
    0%{transform: translate3d(0, 105vh, 0) scale(0); opacity: 0}
    10%{opacity: .7}
    90%{opacity: .7}
    100%{transform: translate3d(0, -10vh, 0) scale(1); opacity: 0}
  }

  /* ===== Content ===== */
  main{
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ===== Hammer ===== */
  .hammer{
    display: inline-block;
    font-size: clamp(56px, 11vw, 92px);
    margin-bottom: 28px;
    transform-origin: 60% 80%;
    animation: swing 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 25px rgba(255,122,61,.55));
    will-change: transform;
  }
  @keyframes swing{
    0%,100%{transform: rotate(-25deg)}
    50%{transform: rotate(20deg)}
  }

  /* ===== BUILDING (animated gradient text) ===== */
  .title{
    font-size: clamp(40px, 10vw, 92px);
    font-weight: 900;
    letter-spacing: 4px;
    line-height: 1;
    margin-bottom: 22px;
    display: inline-block;

    background-image: linear-gradient(
      90deg,
      #ff7a3d 0%,
      #ffb84d 20%,
      #ff9a5c 40%,
      #a855f7 60%,
      #ff4d94 80%,
      #ff7a3d 100%
    );
    background-size: 300% 100%;
    background-repeat: repeat;

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;

    animation: feed 4s linear infinite;
    will-change: background-position;
  }
  @keyframes feed{
    0%   { background-position: 0% 50% }
    100% { background-position: 300% 50% }
  }
  @supports not (-webkit-background-clip: text){
    .title{ color: #ff7a3d; }
  }

  /* ===== Dots ===== */
  .dots{
    display: inline-flex;
    gap: 9px;
    margin-bottom: 30px;
  }
  .dots i{
    width: 11px;
    height: 11px;
    border-radius: 50%;
    display: block;
    animation: bounce 1.4s ease-in-out infinite;
    will-change: transform;
  }
  .dots i:nth-child(1){background:#ff7a3d; box-shadow:0 0 15px #ff7a3d; animation-delay:0s}
  .dots i:nth-child(2){background:#ff9a5c; box-shadow:0 0 15px #ff9a5c; animation-delay:.2s}
  .dots i:nth-child(3){background:#a855f7; box-shadow:0 0 15px #a855f7; animation-delay:.4s}
  @keyframes bounce{
    0%,60%,100%{transform: translateY(0)}
    30%{transform: translateY(-13px)}
  }

  /* ===== Play button ===== */
  .play-btn{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 34px;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #fff;
    background: linear-gradient(135deg, #ff7a3d, #ff9a5c);
    border: none;
    cursor: pointer;
    text-decoration: none;
    box-shadow:
      0 10px 30px rgba(255,122,61,.45),
      inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .2s, box-shadow .2s;
    animation: btnPulse 2.4s ease-in-out infinite;
    will-change: transform, box-shadow;
  }
  .play-btn:hover{
    transform: translateY(-3px) scale(1.03);
    box-shadow:
      0 16px 40px rgba(255,122,61,.6),
      inset 0 1px 0 rgba(255,255,255,.3);
    animation-play-state: paused;
  }
  .play-btn:active{transform: translateY(-1px) scale(1)}
  @keyframes btnPulse{
    0%,100%{box-shadow: 0 10px 30px rgba(255,122,61,.45), inset 0 1px 0 rgba(255,255,255,.25)}
    50%{box-shadow: 0 14px 40px rgba(255,122,61,.7), inset 0 1px 0 rgba(255,255,255,.3)}
  }
  .play-btn .arrow{font-size: 18px; transition: transform .2s}
  .play-btn:hover .arrow{transform: translateX(-4px)}

  /* ===== Footer ===== */
  footer{
    position: fixed;
    bottom: 22px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
    font-size: 12px;
    color: #a99fc9;
    letter-spacing: 1px;
    opacity: 0;
    animation: fadeUp 2s ease 1s forwards;
  }
  @keyframes fadeUp{
    from{opacity: 0; transform: translateY(10px)}
    to{opacity: .85; transform: translateY(0)}
  }

  /* ===== Scanline ===== */
  .scan{
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    opacity: .035;
    background: repeating-linear-gradient(
      180deg,
      #ff7a3d 0 1px,
      transparent 1px 3px
    );
  }

  /* ===== Reduced motion ===== */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
    .title{ background-position: 50% 50% }
  }
</style>
</head>
<body>

  <!-- Background layers -->
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
  <div class="particles" id="particles"></div>
  <div class="scan"></div>

  <!-- Content -->
  <main>
    <div class="hammer">🛠️</div>
    <h1 class="title">BUILDING</h1>
    <div class="dots"><i></i><i></i><i></i></div>

    <!-- Play button -->
    <a class="play-btn" href="https://pariorobber.github.io/Marvel-HC/" target="_blank" rel="noopener">
      <span>🎮</span>
      <span>PLAY NOW</span>
      <span class="arrow">↖</span>
    </a>
  </main>

  <!-- Footer -->
  <footer>© 1405</footer>

<script>
  /* ===== Build particles with fragment ===== */
  (function(){
    const container = document.getElementById('particles');
    const colors = ['#ff7a3d', '#ff9a5c', '#a855f7', '#ffffff'];
    const frag = document.createDocumentFragment();

    for (let i = 0; i < 24; i++) {
      const p = document.createElement('div');
      const color = colors[i % colors.length];
      p.className = 'p';
      p.style.cssText =
        `left:${Math.random()*100}%;` +
        `background:${color};` +
        `box-shadow:0 0 12px ${color};` +
        `animation-duration:${10 + Math.random()*15}s;` +
        `animation-delay:${Math.random()*15}s;` +
        `width:${2 + Math.random()*3}px;` +
        `height:${2 + Math.random()*3}px;`;
      frag.appendChild(p);
    }
    container.appendChild(frag);
  })();

  /* ===== Pause animations when tab is hidden ===== */
  document.addEventListener('visibilitychange', () => {
    document.body.style.animationPlayState =
      document.hidden ? 'paused' : 'running';
  });
</script>
</body>
</html>
